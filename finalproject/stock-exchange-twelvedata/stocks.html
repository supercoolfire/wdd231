<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <!-- Meta -->
    <meta charset="UTF-8">
    <meta name="author" content="Jayser Pilapil">
    <meta name="description" content="Browse and filter 20+ stocks with live quotes from Finnhub. Search by name, filter by sector.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title -->
    <title>Stocks | Stock Exchange Tracker</title>

    <!-- Favicon -->
    <link rel="icon" href="../../images/favicon.ico">

    <!-- Open Graph -->
    <meta property="og:title" content="Browse Stocks — Stock Exchange Tracker">
    <meta property="og:description" content="Browse and filter 20+ stocks with live quotes from Finnhub.">
    <meta property="og:image" content="../../images/logo.svg">
    <meta property="og:url" content="https://supercoolfire.github.io/wdd231/finalproject/stock-exchange/stocks.html">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        media="print" onload="this.media='all'">

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <!-- Chart.js (global — required by stocks.js modal chart) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

    <!-- Scripts -->
    <script src="../../scripts/date.js" defer></script>
    <script src="../../scripts/theme-toggle.js" defer></script>
    <link rel="preload" href="data/nav.json" as="fetch" crossorigin>
    <script src="../../scripts/navigation.js" defer></script>
    <script src="../../scripts/hydrate-v6.js" data-file="data/nav.json" defer></script>
    <script src="scripts/stocks.js" type="module"></script>
</head>

<body>
    <header>
        <a class="brand-link" href="index.html">
            <img class="brand-logo" src="../../images/logo.svg" alt="Stock Exchange Tracker logo" width="24" height="24">
            <span class="brand-name">Stock Tracker</span>
        </a>
        <button id="ham-btn" class="hamburger" aria-label="Toggle navigation" aria-expanded="false"></button>
        <nav id="nav-bar" class="navigation">
            <ul id="navigation"><li class="loading-dots"><a href="#">Loading menu�</a></li></ul>
        </nav>
    </header>

    <main>
        <h1>Browse Stocks</h1>

        <p id="rate-limit-badge" class="rate-limit-badge" aria-live="polite"></p>

        <div class="controls">
            <label class="visually-hidden" for="stock-search">Search stocks</label>
            <input type="search" id="stock-search" class="stock-search" placeholder="Search by name or ticker…" autocomplete="off">
            <div class="filter-buttons" id="sector-filters">
                <!-- Populated by stocks.js -->
            </div>
        </div>

        <div id="stock-cards" class="stock-grid">
            <p class="loading-msg loading-dots">Loading stocks</p>
        </div>

        <p id="stock-count" class="stock-count"></p>

        <!-- Detail modal -->
        <dialog id="stock-modal" class="stock-modal">
            <button class="modal-close" id="modal-close" aria-label="Close">&#x2715;</button>
            <div id="modal-body" class="modal-body">
                <!-- Populated by stocks.js -->
            </div>
        </dialog>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> | Jayser Pilapil | Stock Exchange Tracker | WDD 231</p>
        <p id="lastModified"></p>
        <p class="disclaimer">Data provided by Finnhub. For educational use only — not financial advice.</p>
    </footer>
</body>

</html>
