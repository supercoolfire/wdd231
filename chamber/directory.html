<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Jayser Pilapil">
    <meta name="description" content="Browse the member business directory for the local Chamber of Commerce. Find contact info, websites, and membership levels for all registered members.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="Chamber Directory">
    <meta property="og:description" content="Browse local member businesses in the Chamber of Commerce directory. View contact details, websites, and membership levels.">
    <meta property="og:image" content="https://supercoolfire.github.io/wdd231/chamber/images/logo.svg">
    <meta property="og:url" content="https://supercoolfire.github.io/wdd231/chamber/directory.html">

    <title>Poin Nemo Chamber of Commerce | Directory</title>

    <link rel="icon" href="images/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        media="print" onload="this.media='all'">

    <!-- Style Sheets Here -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">
    <link rel="stylesheet" href="styles/modal-click-origin.css">

    <script src="scripts/date.js" defer></script>
    <script src="scripts/directory.js" defer></script>
    <script src="scripts/navigation.js" defer></script>
    <script src="scripts/modal-click-origin.js" defer></script>
    <script src="scripts/rickster-egg-v2.js" defer></script>
    <script src="scripts/theme-toggle.js" defer></script>
</head>

<body>
    <header>
        <div class="page">
            <img src="images/logo.svg" alt="Site Logo" width="512" height="512">
            <span>Point Nemo's Chamber of Commerce</span>
            <button id="ham-btn" class="hamburger" aria-label="Toggle navigation" aria-expanded="false"></button>
            <nav id="nav-bar" class="navigation">
                <ul>
                    <li><a class="rickster-egg" href="#">Home</a></li>
                    <li><a class="rickster-egg" href="#">Discover</a></li>
                    <li class="current"><a class="rickster-egg" href="directory.html" aria-current="page">Business Directory</a></li>
                    <li><a class="rickster-egg" href="#">Join</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <h1>Chamber Directory</h1>
        <div class="menu">
            <button id="grid" aria-pressed="true">Grid</button>
            <button id="list" aria-pressed="false">List</button>
            <div class="member-search-wrap">
                <label for="member-search" class="visually-hidden">Search members</label>
                <input
                    type="search"
                    id="member-search"
                    class="member-search"
                    placeholder="Search members…"
                    aria-label="Search members"
                    autocomplete="off">
            </div>
        </div>
        <div id="cards" class="grid loading-dots rickster-egg">Loading greedy cards</div>
    </main>
    <footer>
        <div class="footer-page">
            <div class="foot-left">
                <address>
                    <strong>Point Nemo's Chamber of Commerce</strong><br>
                    1 Pun Intended Plaza<br>
                    Wordplay Heights, WP 10101<br>
                    info@pncc.com<br>
                    (800) 555-0100
                </address>
            </div>
            <div class="social">
                <a href="https://youtube.com" aria-label="YouTube">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="12" class="bg" fill="currentColor"/>
                    <rect x="5" y="7.5" width="14" height="9" rx="2.6" class="glyph" fill="currentColor"/>
                    <path d="M10.5 10.2v3.6l3.2-1.8z" class="bg" fill="currentColor"/>
                    </svg>
                </a>

                <a href="https://twitter.com" aria-label="Twitter">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="12" class="bg" fill="currentColor"/>
                    <path class="glyph" fill="currentColor" transform="translate(5.2 5.4) scale(0.6)"
                        d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/>
                    </svg>
                </a>

                <a href="https://linkedin.com" aria-label="LinkedIn">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="12" class="bg" fill="currentColor"/>
                    <rect x="6.9" y="10" width="2.3" height="7" class="glyph" fill="currentColor"/>
                    <circle cx="8.05" cy="7.7" r="1.35" class="glyph" fill="currentColor"/>
                    <path class="glyph" fill="currentColor" d="M11 10h2.1v1c.4-.7 1.2-1.2 2.3-1.2 2 0 2.6 1.3 2.6 3.1V17h-2.2v-3.5c0-.9-.2-1.6-1.2-1.6s-1.4.7-1.4 1.6V17H11z"/>
                    </svg>
                </a>
                </div>
            <div class="foot-right">
                <p>WDD231 Class Project</p>
                <p>&copy;<span id="currentyear"></span> Point Nemo Chamber of Commerce</p>
                <p id="lastModified"></p>
            </div>
        </div>
    </footer>
</body>

</html>
